name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop

# Explicit permissions following principle of least privilege
permissions:
  contents: read        # Read repository contents
  pull-requests: read   # Read PR metadata

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run type check
        run: npm run check

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.CI_POSTGRES_DB }}
          POSTGRES_MAX_CONNECTIONS: 100
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run database migrations
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}

      - name: Seed default metrics
        run: npx tsx scripts/seed-default-metrics.ts
        env:
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}

      - name: Apply cascade delete triggers
        run: ./scripts/apply-cascade-triggers.sh
        env:
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}

      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          NODE_OPTIONS: --max-old-space-size=4096
          SESSION_SECRET: test-secret-key-for-ci
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}

      - name: Cleanup test database
        if: always()
        run: ./scripts/ci-test-cleanup.sh
        env:
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.CI_POSTGRES_DB }}
          POSTGRES_MAX_CONNECTIONS: 100
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup project
        uses: ./.github/actions/setup

      # Use fixed test credentials for integration tests
      # Random passwords were causing bcrypt comparison failures

      - name: Run database migrations
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}

      - name: Seed default metrics
        run: npx tsx scripts/seed-default-metrics.ts
        env:
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}

      - name: Apply cascade delete triggers
        run: ./scripts/apply-cascade-triggers.sh
        env:
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}
          SESSION_SECRET: test-secret-key-for-ci
          # ADMIN_PASSWORD not set - will use default 'TestPassword123!' from test file

      - name: Cleanup test database
        if: always()
        run: ./scripts/ci-test-cleanup.sh
        env:
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not created"
            exit 1
          fi
          if [ ! -f "dist/index.js" ]; then
            echo "Error: dist/index.js (API build) not found"
            exit 1
          fi
          if [ ! -d "dist/public" ]; then
            echo "Error: dist/public (frontend build) not found"
            exit 1
          fi
          echo "✅ Build verification successful"
          echo "   - API: dist/index.js"
          echo "   - Frontend: dist/public/"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run security audit
        run: ./scripts/security-audit.sh

  migration-lint:
    name: Migration Idempotency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Need full history for diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for modified migrations
        id: check-migrations
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Get list of added or modified migration files in this PR
          # shellcheck disable=SC2086
          CHANGED_MIGRATIONS=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD" -- 'migrations/*.sql' | grep -v '_down\.sql$' || true)

          if [ -z "$CHANGED_MIGRATIONS" ]; then
            echo "No new or modified migrations found"
            echo "has_migrations=false" >> $GITHUB_OUTPUT
          else
            echo "Found migrations to lint:"
            echo "$CHANGED_MIGRATIONS"
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            # Save to file for next step
            echo "$CHANGED_MIGRATIONS" > /tmp/migrations_to_lint.txt
          fi

      - name: Lint modified migrations
        if: steps.check-migrations.outputs.has_migrations == 'true'
        run: |
          echo "Linting migrations for idempotency..."
          EXIT_CODE=0
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "Checking: $file"
              node scripts/lint-migrations.js "$file" || EXIT_CODE=1
            fi
          done < /tmp/migrations_to_lint.txt
          exit $EXIT_CODE

  workflow-lint:
    name: Workflow Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run actionlint
        uses: raven-actions/actionlint@v1
        with:
          fail-on-error: true
