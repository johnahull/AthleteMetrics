name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Automated PR Review
        id: claude-review
        timeout-minutes: 12
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          prompt: |
            Review PR #${{ github.event.pull_request.number }}.

            Steps:
            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to get the diff
            2. Only read full files if the diff lacks sufficient context
            3. Review for: bugs, security issues, correctness, and convention violations
            4. Post a single review comment via `gh pr comment ${{ github.event.pull_request.number }} --body "..."`

            Review format:
            ```
            ## Code Review — PR #<number>

            **What is Good**
            - [list strengths briefly]

            **Issues Found**
            - [Important] file:line — description and suggested fix
            - [Minor] file:line — description

            If no issues: "No issues found. LGTM."
            ```

            Rules:
            - Be concise — focus on what matters, skip nitpicks
            - Only flag real issues, not style preferences
            - Do not read .claude/agents/ or invoke sub-agents

          claude_args: --max-turns 15 --allowed-tools "Bash(gh:*),Read,Grep,Glob"

          additional_permissions: |
            actions: read
            pull-requests: write

