name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    # Skip release PRs (develop → main). These bundle commits that were already
    # reviewed individually on their feature → develop PRs, so re-reviewing the
    # combined diff adds little and blocks the release on an expiring OAuth token.
    if: github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Auth: uses Claude Code OAuth (included with Claude Pro/Team subscription).
      # If reviews stop working, refresh the token:
      #   gh secret set CLAUDE_CODE_OAUTH_TOKEN
      # Generate a new token at: https://console.anthropic.com/settings/tokens
      - name: Run Automated PR Review
        id: claude-review
        timeout-minutes: 12
        continue-on-error: false
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The @claude fix action authors commits as claude[bot] but PUSHES them
          # under the GITHUB_TOKEN identity (github-actions), so the synchronize
          # event it triggers is attributed to "github-actions", not "claude".
          # Include it so a bot-applied fix doesn't leave claude-review red.
          allowed_bots: "claude,github-actions"

          prompt: |
            Review PR #${{ github.event.pull_request.number }}.

            Steps:
            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to get the diff
            2. Only read full files when surrounding context is needed to judge correctness
            3. Review the diff against this checklist:
               - Bugs, logic errors, off-by-one, null/undefined risks
               - Security: injection, auth bypass, secret exposure, unsafe input handling
               - TypeScript: incorrect types, unsafe casts, missing null checks
               - Performance: N+1 queries, missing indexes, unbounded loops, memory leaks
               - Test coverage: new logic without tests, missing edge cases
               - AthleteMetrics conventions from CLAUDE.md (org scoping, permission checks, Drizzle patterns)
            4. Post a single review comment via `gh pr comment ${{ github.event.pull_request.number }} --body "..."`

            Review format:
            ```
            ## Code Review — PR #<number>

            **What is Good**
            - [list strengths briefly]

            **Issues Found**

            **Important (Should Fix)**
            - file:line — description and suggested fix

            **Minor (Nice to Have)**
            - file:line — description

            If no issues: "No issues found. LGTM."
            ```

            Rules:
            - Be concise — focus on what matters, skip nitpicks and style preferences
            - Categorize issues by severity so authors know what to prioritize
            - Do not read .claude/agents/ or invoke sub-agents

          claude_args: --model claude-sonnet-4-6 --max-turns 40 --allowed-tools "Bash(gh:*),Read,Grep,Glob"

          additional_permissions: |
            actions: read
            pull-requests: write

