name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Add explicit timeout to prevent infinite hanging
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Automated PR Review
        id: claude-review
        timeout-minutes: 12  # Step-level timeout (shorter than job timeout)
        continue-on-error: true  # Don't fail the entire workflow if Claude times out
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            You are performing an automated code review for PR #${{ github.event.pull_request.number }}.

            Read the agent definition at .claude/agents/pr-lifecycle-agent.md for review guidelines.

            Tasks:
            1. Fetch PR diff: `gh pr diff ${{ github.event.pull_request.number }}`
            2. Read all changed files for context
            3. Perform comprehensive code review covering:
               - Code quality & best practices
               - Security vulnerabilities (OWASP Top 10)
               - Performance considerations
               - Test coverage
               - TypeScript type safety
               - AthleteMetrics conventions (from CLAUDE.md)
            4. Invoke specialized agents for domain-specific review if needed
            5. Post review comment using the format from pr-lifecycle-agent.md

            Use `gh pr comment ${{ github.event.pull_request.number }} --body "..."` to post your review.

            Important:
            - Follow AthleteMetrics patterns from CLAUDE.md
            - Use TodoWrite to track review tasks
            - Be constructive and specific in feedback

          claude_args: --max-turns 20 --model sonnet --allowed-tools "Bash(gh:*),Read,Grep,Glob,TodoWrite"

          additional_permissions: |
            actions: read
            pull-requests: write

      - name: Notify if review timed out
        if: steps.claude-review.outcome == 'failure' && steps.claude-review.conclusion == 'cancelled'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Automated code review timed out**\n\nThe Claude Code review took longer than expected and was cancelled. This usually happens with large PRs or when the service is slow.\n\n**What to do:**\n- You can manually trigger a review by commenting `@claude review this PR`\n- Or proceed with manual code review\n- Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details'
            })

