name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

env:
  RAILWAY_API_URL: https://backboard.railway.app/graphql/v2
  PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
  TESTING_ENV_ID: ${{ vars.RAILWAY_TESTING_ENV_ID }}
  SERVICE_ID: ${{ vars.RAILWAY_TESTING_SERVICE_ID }}

jobs:
  deploy-preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    # Preview deployments are informational — don't block PR mergeability
    continue-on-error: true
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Find existing preview comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Railway Preview'

      - name: Post deployment starting comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## Railway Preview

            Deploying `${{ github.head_ref }}` @ `${{ github.event.pull_request.head.sha }}`...

      - name: Create or reuse preview environment
        id: env
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -o pipefail
          UUID_RE='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          ENV_NAME="pr-${{ github.event.pull_request.number }}"

          # Check if environment already exists
          RESPONSE=$(curl -sf -X POST "$RAILWAY_API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -d "{\"query\": \"{ project(id: \\\"$PROJECT_ID\\\") { environments { edges { node { id name } } } } }\"}")
          echo "Environment list response: $RESPONSE"

          ENV_ID=$(echo "$RESPONSE" | jq -r --arg name "$ENV_NAME" \
            '.data.project.environments.edges[] | select(.node.name==$name) | .node.id')

          if [ -n "$ENV_ID" ]; then
            echo "Environment '$ENV_NAME' exists (id: $ENV_ID), reusing"
          else
            # Create by duplicating testing env (ephemeral = auto-cleanup eligible)
            RESULT=$(curl -sf -X POST "$RAILWAY_API_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
              -d "{\"query\": \"mutation { environmentCreate(input: { name: \\\"$ENV_NAME\\\", projectId: \\\"$PROJECT_ID\\\", ephemeral: true, sourceEnvironmentId: \\\"$TESTING_ENV_ID\\\" }) { id name } }\"}")

            ENV_ID=$(echo "$RESULT" | jq -r '.data.environmentCreate.id // empty')
            if [ -z "$ENV_ID" ]; then
              echo "::error::Failed to create environment: $RESULT"
              exit 1
            fi
            echo "Environment '$ENV_NAME' created (id: $ENV_ID)"
          fi

          # Validate ENV_ID is a UUID before interpolating into subsequent queries
          if ! [[ "$ENV_ID" =~ $UUID_RE ]]; then
            echo "::error::ENV_ID is not a valid UUID: '$ENV_ID'"
            exit 1
          fi

          echo "env_id=$ENV_ID" >> "$GITHUB_OUTPUT"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"

      - name: Configure preview database
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          TESTING_DB_URL: ${{ secrets.TESTING_DATABASE_PUBLIC_URL }}
        run: |
          set -o pipefail
          ENV_ID="${{ steps.env.outputs.env_id }}"

          # PR environments don't have their own database service.
          # Override DATABASE_URL to use the testing DB's public endpoint.
          # LIMITATION: All open PR previews share this database. PRs that include
          # schema migrations will affect every other open preview. Ensure migrations
          # are backwards-compatible, or coordinate destructive migrations manually.
          PAYLOAD=$(jq -n \
            --arg pid "$PROJECT_ID" --arg eid "$ENV_ID" --arg sid "$SERVICE_ID" --arg dburl "$TESTING_DB_URL" \
            '{query: "mutation { variableUpsert(input: { projectId: \"\($pid)\", environmentId: \"\($eid)\", serviceId: \"\($sid)\", name: \"DATABASE_URL\", value: \"\($dburl)\" }) }"}')
          RESULT=$(curl -sf -X POST "$RAILWAY_API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -d "$PAYLOAD")

          if echo "$RESULT" | jq -e '.data.variableUpsert' > /dev/null 2>&1; then
            echo "DATABASE_URL configured for preview environment"
          else
            echo "::warning::Failed to set DATABASE_URL: $RESULT"
          fi

      - name: Connect source repo and create deployment trigger
        id: trigger
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          ENV_ID="${{ steps.env.outputs.env_id }}"

          # The testing service has no GitHub repo connected (deployed via railway up).
          # Connect the source repo and create a deployment trigger for the PR branch.

          # Step 1: Connect the service instance to the GitHub repo
          PAYLOAD=$(jq -n \
            --arg eid "$ENV_ID" --arg sid "$SERVICE_ID" --arg repo "$REPO" \
            '{query: "mutation { serviceInstanceUpdate(environmentId: \"\($eid)\", input: { source: { repo: \"\($repo)\" } }, serviceId: \"\($sid)\") }"}')
          RESULT=$(curl -s -X POST "$RAILWAY_API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -d "$PAYLOAD")
          echo "Source update: $RESULT"

          # Step 2: Create a deployment trigger for the PR branch
          # If the trigger already exists (reused environment), this returns null
          # and Railway's auto-deploy webhook handles subsequent pushes.
          PAYLOAD=$(jq -n \
            --arg pid "$PROJECT_ID" --arg eid "$ENV_ID" --arg sid "$SERVICE_ID" \
            --arg branch "$BRANCH" --arg repo "$REPO" \
            '{query: "mutation { deploymentTriggerCreate(input: { branch: \"\($branch)\", projectId: \"\($pid)\", environmentId: \"\($eid)\", provider: \"github\", repository: \"\($repo)\", serviceId: \"\($sid)\" }) { id } }"}')
          RESULT=$(curl -s -X POST "$RAILWAY_API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -d "$PAYLOAD")
          echo "Trigger create: $RESULT"

          # If the trigger was created, use it. Otherwise assume it already exists
          # (reused environment) and let Railway's auto-deploy webhook handle it.
          # We warn on errors rather than hard-failing because the trigger already
          # existing is the most common error, and auto-deploy covers it regardless
          # of the exact error message Railway returns.
          TRIGGER_ID=$(echo "$RESULT" | jq -r '.data.deploymentTriggerCreate.id // empty')

          if [ -n "$TRIGGER_ID" ]; then
            echo "Deployment trigger created (id: $TRIGGER_ID) for branch $BRANCH"
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          else
            if echo "$RESULT" | jq -e '(.errors // []) | length > 0' > /dev/null 2>&1; then
              echo "::warning::deploymentTriggerCreate returned error (likely duplicate): $RESULT"
            fi
            echo "Trigger already exists — Railway auto-deploys on push"
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deployment
        id: deploy
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -o pipefail
          ENV_ID="${{ steps.env.outputs.env_id }}"

          # Only call environmentTriggersDeploy for newly created triggers.
          # For existing triggers, Railway's auto-deploy webhook already fired
          # when GitHub pushed — calling this again would create a duplicate build.
          if [ "${{ steps.trigger.outputs.is_new }}" = "true" ]; then
            echo "New trigger — firing explicit deploy..."
            PAYLOAD=$(jq -n \
              --arg pid "$PROJECT_ID" --arg eid "$ENV_ID" --arg sid "$SERVICE_ID" \
              '{query: "mutation { environmentTriggersDeploy(input: { projectId: \"\($pid)\", environmentId: \"\($eid)\", serviceId: \"\($sid)\" }) }"}')
            RESULT=$(curl -s -X POST "$RAILWAY_API_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
              -d "$PAYLOAD")

            echo "Deploy API response: $RESULT"
            SUCCESS=$(echo "$RESULT" | jq -r '.data.environmentTriggersDeploy // empty')
            if [ "$SUCCESS" != "true" ]; then
              echo "::error::Failed to trigger deployment: $RESULT"
              exit 1
            fi
          else
            echo "Existing trigger — skipping explicit deploy (auto-deploy handles it)"
          fi

          # Verify deployment was actually created (allow up to 60s)
          DEPLOY_STATUS="NONE"
          for i in 1 2 3 4 5 6; do
            sleep 10
            CHECK=$(curl -s -X POST "$RAILWAY_API_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
              -d "$(jq -n --arg eid "$ENV_ID" --arg sid "$SERVICE_ID" \
                '{query: "{ deployments(first: 1, input: { environmentId: \"\($eid)\", serviceId: \"\($sid)\" }) { edges { node { id status } } } }"}')")
            DEPLOY_STATUS=$(echo "$CHECK" | jq -r '.data.deployments.edges[0].node.status // "NONE"')
            echo "Deployment status (attempt $i): $DEPLOY_STATUS"
            if [ "$DEPLOY_STATUS" != "NONE" ]; then
              break
            fi
          done

          if [ "$DEPLOY_STATUS" = "NONE" ]; then
            echo "::error::No deployment created after trigger"
            exit 1
          fi

      - name: Get preview domain
        id: domain
        if: steps.deploy.outcome == 'success'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -o pipefail
          ENV_ID="${{ steps.env.outputs.env_id }}"

          # Query service domain (retry since Railway provisions domains asynchronously)
          DOMAIN=""
          for ATTEMPT in 1 2 3 4 5; do
            DOMAIN=$(curl -sf -X POST "$RAILWAY_API_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
              -d "{\"query\": \"{ project(id: \\\"$PROJECT_ID\\\") { services { edges { node { id name serviceInstances { edges { node { domains { serviceDomains { domain } } environmentId } } } } } } } }\"}" \
              | jq -r ".data.project.services.edges[] | select(.node.id==\"$SERVICE_ID\") | .node.serviceInstances.edges[] | select(.node.environmentId==\"$ENV_ID\") | .node.domains.serviceDomains[0].domain // empty")

            if [ -n "$DOMAIN" ]; then
              echo "url=https://$DOMAIN" >> "$GITHUB_OUTPUT"
              echo "Preview URL: https://$DOMAIN"
              break
            fi
            echo "Domain not yet provisioned (attempt $ATTEMPT/5), waiting 10s..."
            if [ "$ATTEMPT" -lt 5 ]; then
              sleep 10
            fi
          done

          if [ -z "$DOMAIN" ]; then
            echo "Domain not available yet — check Railway dashboard"
          fi

      - name: Update comment with result
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## Railway Preview

            | | |
            |---|---|
            | **Status** | ${{ steps.deploy.outcome == 'success' && 'Deployed' || 'Failed' }} |
            | **Preview** | ${{ steps.domain.outputs.url || 'See Railway dashboard' }} |
            | **Branch** | `${{ github.head_ref }}` |
            | **Commit** | `${{ github.event.pull_request.head.sha }}` |
            | **Logs** | [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

  cleanup-preview:
    name: Cleanup PR Preview
    runs-on: ubuntu-latest
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Delete preview environment
        continue-on-error: true
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -o pipefail
          ENV_NAME="pr-${{ github.event.pull_request.number }}"

          # Find environment ID
          ENV_ID=$(curl -sf -X POST "$RAILWAY_API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -d "{\"query\": \"{ project(id: \\\"$PROJECT_ID\\\") { environments { edges { node { id name } } } } }\"}" \
            | jq -r --arg name "$ENV_NAME" \
              '.data.project.environments.edges[] | select(.node.name==$name) | .node.id')

          if [ -z "$ENV_ID" ]; then
            echo "Environment '$ENV_NAME' not found, nothing to clean up"
            exit 0
          fi

          # Validate ENV_ID before interpolating into delete mutation
          UUID_RE='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          if ! [[ "$ENV_ID" =~ $UUID_RE ]]; then
            echo "::error::ENV_ID is not a valid UUID: '$ENV_ID'"
            exit 1
          fi

          # Delete environment
          RESULT=$(curl -sf -X POST "$RAILWAY_API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -d "{\"query\": \"mutation { environmentDelete(id: \\\"$ENV_ID\\\") }\"}")

          if echo "$RESULT" | jq -e '.data.environmentDelete == true' > /dev/null 2>&1; then
            echo "Environment '$ENV_NAME' deleted"
          else
            echo "::warning::Failed to delete environment: $RESULT"
          fi

      - name: Find preview comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Railway Preview'

      - name: Update comment — cleaned up
        if: steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## Railway Preview

            Preview environment cleaned up (PR closed/merged).
