name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  deploy-preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Find existing preview comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Railway Preview'

      - name: Post deployment starting comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## Railway Preview

            Deploying `${{ github.head_ref }}` @ `${{ github.event.pull_request.head.sha }}`...

      - name: Create or reuse preview environment
        id: env
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          ENV_NAME="pr-${{ github.event.pull_request.number }}"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"

          # Link to the project
          railway link --project "${{ secrets.RAILWAY_PROJECT_ID }}"

          # Create the environment by duplicating staging; handle "already exists" gracefully
          OUTPUT=$(railway environment new "$ENV_NAME" --duplicate staging 2>&1) && {
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "Environment '$ENV_NAME' created from staging"
          } || {
            if echo "$OUTPUT" | grep -qi "already exists"; then
              echo "created=false" >> "$GITHUB_OUTPUT"
              echo "Environment '$ENV_NAME' already exists, reusing"
            else
              echo "::error::Failed to create environment '$ENV_NAME': $OUTPUT"
              exit 1
            fi
          }

      - name: Deploy to Railway preview environment
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          ENV_NAME="pr-${{ github.event.pull_request.number }}"

          # Upload source and trigger build on Railway (Dockerfile-based)
          railway up --detach \
            --environment "$ENV_NAME" \
            --service athletemetrics-staging

      - name: Get preview domain
        id: domain
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          ENV_NAME="pr-${{ github.event.pull_request.number }}"

          # Query actual domain from Railway instead of assuming naming convention
          DOMAIN=$(railway domain \
            --environment "$ENV_NAME" \
            --service athletemetrics-staging \
            --json 2>/dev/null | jq -r '.[0] // empty' 2>/dev/null || true)

          if [ -n "$DOMAIN" ]; then
            echo "url=https://$DOMAIN" >> "$GITHUB_OUTPUT"
          else
            # Fallback: generate a domain if none exists
            DOMAIN=$(railway domain \
              --environment "$ENV_NAME" \
              --service athletemetrics-staging 2>/dev/null || true)
            if [ -n "$DOMAIN" ]; then
              echo "url=https://$DOMAIN" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Update comment with result
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## Railway Preview

            | | |
            |---|---|
            | **Status** | ${{ steps.deploy.outcome == 'success' && 'Deployed' || 'Failed' }} |
            | **Preview** | ${{ steps.domain.outputs.url || 'See Railway dashboard' }} |
            | **Branch** | `${{ github.head_ref }}` |
            | **Commit** | `${{ github.event.pull_request.head.sha }}` |
            | **Logs** | [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

  cleanup-preview:
    name: Cleanup PR Preview
    runs-on: ubuntu-latest
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Delete preview environment
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          ENV_NAME="pr-${{ github.event.pull_request.number }}"

          railway link --project "${{ secrets.RAILWAY_PROJECT_ID }}"
          railway environment delete "$ENV_NAME" --yes

      - name: Find preview comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Railway Preview'

      - name: Update comment — cleaned up
        if: steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## Railway Preview

            Preview environment cleaned up (PR closed/merged).
