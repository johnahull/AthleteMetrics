name: Deploy to Production

on:
  release:
    types: [published]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test and Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: release-deployment
    permissions:
      contents: write
      issues: write
      pull-requests: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.CI_POSTGRES_DB }}
          POSTGRES_MAX_CONNECTIONS: 100
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run TypeScript type check
        run: npm run check

      - name: Generate test credentials
        run: |
          TEST_PASS="$(openssl rand -base64 12)Aa1!"
          echo "ADMIN_PASSWORD=${TEST_PASS}" >> "$GITHUB_ENV"
          echo "✅ Generated secure test credentials"

      - name: Setup test database schema
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}

      - name: Seed default metrics
        run: npx tsx scripts/seed-default-metrics.ts
        env:
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}
          SESSION_SECRET: test-secret-key-for-ci
          ADMIN_USER: admin
          ADMIN_EMAIL: admin@test.com
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}

      - name: Run security audit
        id: security-audit
        run: ./scripts/security-audit.sh

      - name: Handle security audit failure
        if: failure() && steps.security-audit.outcome == 'failure'
        run: |
          echo "❌ Security audit failed - deployment BLOCKED"
          echo ""
          echo "🔧 To resolve:"
          echo "1. Review audit results above"
          echo "2. Update vulnerable dependencies: npm audit fix"
          echo "3. For vulnerabilities without fixes, review alternatives"
          echo "4. Re-run workflow after fixes are committed"
          exit 1

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not created"
            exit 1
          fi
          if [ ! -f "dist/index.js" ]; then
            echo "Error: dist/index.js (API build) not found"
            exit 1
          fi
          if [ ! -d "dist/public" ]; then
            echo "Error: dist/public (frontend build) not found"
            exit 1
          fi
          echo "✅ Build verification successful"
          echo "   - API: dist/index.js"
          echo "   - Frontend: dist/public/"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg

          # Verify GPG key fingerprint with exact matching to prevent partial match attacks
          FINGERPRINT=$(sudo gpg --no-default-keyring --keyring /etc/apt/trusted.gpg.d/postgresql.gpg --fingerprint ACCC4CF8 2>/dev/null | grep -A1 "pub" | tail -n1 | tr -d ' ')
          EXPECTED="B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "❌ PostgreSQL GPG key fingerprint verification failed"
            echo "Expected: $EXPECTED"
            echo "Got: $FINGERPRINT"
            exit 1
          fi
          echo "✅ PostgreSQL GPG key fingerprint verified"

          # Make keyring immutable to prevent TOCTOU race condition
          # KNOWN LIMITATION: There is a small TOCTOU (time-of-check-time-of-use) window between
          # GPG key verification and APT package installation. The chattr +i command below
          # mitigates this risk by making the keyring immutable after verification.
          # However, on filesystems that don't support chattr (e.g., tmpfs), the immutability
          # flag cannot be set. In practice, this is a low-risk scenario in GitHub Actions
          # because the runner environment is ephemeral and isolated.
          # Alternative mitigation: Use apt-key with inline verification (not implemented due
          # to apt-key deprecation in newer Ubuntu versions).
          if sudo chattr +i /etc/apt/trusted.gpg.d/postgresql.gpg 2>/dev/null; then
            echo "✅ Keyring set to immutable"
          else
            echo "⚠️  chattr +i not supported on this filesystem - TOCTOU mitigation not available"
            echo "   This is a known limitation on some CI runner filesystems (e.g., tmpfs)"
          fi

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Update alternatives to use PostgreSQL 17 by default
          sudo update-alternatives --install /usr/bin/pg_dump pg_dump /usr/lib/postgresql/17/bin/pg_dump 100
          sudo update-alternatives --install /usr/bin/pg_restore pg_restore /usr/lib/postgresql/17/bin/pg_restore 100
          # Verify version
          pg_dump --version

      - name: Backup production database
        run: node scripts/backup-database.js
        env:
          USE_RAILWAY_BACKUPS: false
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_PRODUCTION_SERVICE_ID }}
          PUBLIC_DATABASE_URL: ${{ secrets.RAILWAY_PRODUCTION_PUBLIC_DATABASE_URL }}
          BACKUP_RETENTION_DAYS: 30

      # NOTE: Backup artifacts are NOT uploaded to GitHub Actions for security reasons.
      # Production backups contain sensitive data and should not be stored in GitHub.
      # Access backups via Railway CLI: railway run --service <SERVICE_ID> ls backups/
      # See docs/database-migration-rollback.md for backup access procedures

      - name: Validate database migrations
        run: |
          echo "🔍 Validating migrations for safety..."
          npm run db:validate
          echo "✅ Migration validation passed"

      - name: Run database migrations
        timeout-minutes: 30
        id: migrate
        run: |
          echo "🔄 Running database migrations BEFORE deployment..."
          echo "⚠️  CRITICAL: Migrations must complete before deploying new code"
          echo ""
          echo "📦 Running drizzle migrations (0000-0013)..."
          npm run db:migrate
          echo "✅ Drizzle migrations completed"
          echo ""
          echo "📦 Running manual SQL migrations (0014-0021)..."
          npm run db:migrate:manual
          echo "✅ Manual migrations completed"
          echo ""
          echo "✅ All migrations completed successfully"
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_PRODUCTION_PUBLIC_DATABASE_URL }}

      - name: Verify migration completion
        timeout-minutes: 5
        id: verify-migrations
        if: steps.migrate.outcome == 'success'
        run: |
          echo "🔍 Verifying all migrations applied correctly..."
          node scripts/verify-migration-completion.js
          echo "✅ Migration verification passed"
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_PRODUCTION_PUBLIC_DATABASE_URL }}

      - name: Handle migration failure
        if: failure() && (steps.migrate.outcome == 'failure' || steps.verify-migrations.outcome == 'failure')
        env:
          VERIFY_OUTCOME: ${{ steps.verify-migrations.outcome }}
          DATABASE_URL: ${{ secrets.RAILWAY_PRODUCTION_PUBLIC_DATABASE_URL }}
        run: |
          # Sanitize DATABASE_URL for logging (hide password)
          # Extract protocol and host, mask credentials
          SAFE_DB_URL="${DATABASE_URL%%://*}://****:****@${DATABASE_URL##*@}"

          echo "❌ Migration failed - deployment BLOCKED"
          echo "Database: $SAFE_DB_URL"
          echo ""
          if [ "$VERIFY_OUTCOME" == "failure" ]; then
            echo "⚠️  CRITICAL: Migration verification detected incomplete database structure in PRODUCTION!"
            echo "   This usually means migrations were skipped due to existing schema."
            echo ""
            echo "🔧 Resolution steps (PRODUCTION - BE EXTREMELY CAREFUL):"
            echo "1. Verify database backup exists before proceeding"
            echo "2. Manually apply missing migrations from migrations/ folder"
            echo "3. Run: railway run --environment production bash"
            echo "4. Apply migrations: for f in migrations/*.sql; do psql \$DATABASE_URL -f \$f; done"
            echo "5. Re-run this workflow"
            echo ""
          fi
          echo "⚠️  Manual intervention required:"
          echo "1. Check Railway logs for migration errors"
          echo "2. Review verification output above"
          echo "3. Ensure database backup is available"
          echo "4. Review migration files for issues"
          echo ""
          echo "See docs/database-migration-rollback.md for detailed procedures"
          exit 1

      - name: Deploy to Railway Production
        if: steps.migrate.outcome == 'success' && steps.verify-migrations.outcome == 'success'
        id: deploy
        run: |
          echo "🚀 Deploying to Railway Production..."

          # Capture current deployment ID for potential rollback (BEFORE deploying)
          CURRENT_DEPLOYMENT=$(railway deployments list --service "${{ secrets.RAILWAY_PRODUCTION_SERVICE_ID }}" --json | jq -r '.data[0].id' || echo "")
          echo "current_deployment_id=$CURRENT_DEPLOYMENT" >> "$GITHUB_OUTPUT"
          echo "📝 Current deployment (pre-deploy): $CURRENT_DEPLOYMENT"

          # Deploy the application (migrations already applied above)
          railway up --service "${{ secrets.RAILWAY_PRODUCTION_SERVICE_ID }}" --environment production --detach

          echo "✅ Deployment initiated"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}

      - name: Wait for Railway deployment
        run: node scripts/wait-for-deployment.js
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_PRODUCTION_SERVICE_ID }}
          DEPLOYMENT_POLL_INTERVAL: 5
          DEPLOYMENT_TIMEOUT: 300
        continue-on-error: true

      - name: Run health check
        id: health-check
        run: node scripts/health-check.js
        env:
          HEALTH_CHECK_URL: ${{ secrets.PRODUCTION_URL }}
          HEALTH_CHECK_TIMEOUT: 60000
          HEALTH_CHECK_RETRIES: 5
        continue-on-error: true

      - name: Run smoke tests
        id: smoke-tests
        if: steps.health-check.outcome == 'success'
        run: node scripts/smoke-tests.js
        env:
          BASE_URL: ${{ secrets.PRODUCTION_URL }}
        continue-on-error: true

      - name: Automated rollback on failure
        if: steps.health-check.outcome == 'failure' || steps.smoke-tests.outcome == 'failure'
        run: |
          echo "⚠️ Health check or smoke tests failed!"
          echo "🔄 Initiating automated rollback..."

          PREVIOUS_DEPLOYMENT="${{ steps.deploy.outputs.current_deployment_id }}"

          if [ -n "$PREVIOUS_DEPLOYMENT" ] && [ "$PREVIOUS_DEPLOYMENT" != "null" ]; then
            echo "📝 Previous deployment: $PREVIOUS_DEPLOYMENT"
            echo ""
            echo "⚠️  AUTOMATED ROLLBACK NOT AVAILABLE"
            echo "Railway CLI v3 does not support programmatic rollback to specific deployment IDs."
            echo ""
            echo "🔧 MANUAL ROLLBACK REQUIRED:"
            echo "1. Go to Railway Dashboard: https://railway.app"
            echo "2. Navigate to your production service"
            echo "3. Find deployment: $PREVIOUS_DEPLOYMENT"
            echo "4. Click the three dots (...) and select 'Rollback'"
            echo "5. Confirm the rollback"
            echo ""
            echo "📊 Deployment Health Status:"
            echo "   - Health Check: ${{ steps.health-check.outcome }}"
            echo "   - Smoke Tests: ${{ steps.smoke-tests.outcome }}"
            echo ""
          else
            echo "⚠️ No previous deployment found"
            echo "🔧 Manual intervention required."
            echo "Railway Dashboard: https://railway.app"
          fi

          exit 1
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          HEALTH_CHECK_URL: ${{ secrets.PRODUCTION_URL }}
          HEALTH_CHECK_TIMEOUT: 30000
          HEALTH_CHECK_RETRIES: 3

      - name: Notify deployment success
        if: success()
        run: |
          echo "🚀 Production deployment successful!"
          echo "Release: ${{ github.event.release.tag_name }}"
          echo "URL: ${{ secrets.PRODUCTION_URL }}"
          echo "Deployment completed at: $(date)"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Production deployment failed!"
          echo "Release: ${{ github.event.release.tag_name }}"
          echo "Check the logs above for details."
          exit 1

      - name: Post deployment comment
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const status = '${{ job.status }}';
            const release = context.payload.release;
            const healthCheck = '${{ steps.health-check.outcome }}';
            const smokeTests = '${{ steps.smoke-tests.outcome }}';
            const rollbackAttempted = (healthCheck === 'failure' || smokeTests === 'failure');

            let body = `## 🚀 Production Deployment ${status === 'success' ? '✅' : '❌'}\n\n`;
            body += `**Release:** ${release.tag_name}\n`;
            body += `**URL:** ${{ secrets.PRODUCTION_URL }}\n`;
            body += `**Health Check:** ${healthCheck === 'success' ? '✅ Passed' : '❌ Failed'}\n`;
            body += `**Smoke Tests:** ${smokeTests === 'success' ? '✅ Passed' : smokeTests === 'skipped' ? '⏭️ Skipped' : '❌ Failed'}\n`;
            body += `**Final Status:** ${status}\n`;

            if (rollbackAttempted) {
              body += `\n### 🔄 Automated Rollback\n`;
              body += `Deployment health checks failed. Automated rollback was initiated.\n`;
              body += `Previous deployment was restored to maintain service stability.\n`;
              body += `\n**Action Required:** Investigate failure and retry deployment.\n`;
            } else if (status !== 'success') {
              body += `\n⚠️ Deployment failed before health checks. No rollback performed.\n`;
              body += `Check Railway dashboard: https://railway.app/project/${{ secrets.RAILWAY_PRODUCTION_SERVICE_ID }}\n`;
            } else {
              body += `\n✅ Deployment completed successfully with all checks passing.\n`;
            }

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });
