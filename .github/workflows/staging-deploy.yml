name: Deploy to Staging

on:
  push:
    branches:
      - develop

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test and Deploy to Staging
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.CI_POSTGRES_DB }}
          POSTGRES_MAX_CONNECTIONS: 100
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run TypeScript type check
        run: npm run check

      - name: Generate test credentials
        run: |
          TEST_PASS="$(openssl rand -base64 12)Aa1!"
          echo "ADMIN_PASSWORD=${TEST_PASS}" >> "$GITHUB_ENV"
          echo "✅ Generated secure test credentials"

      - name: Setup test database schema
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}

      - name: Seed default metrics
        run: npx tsx scripts/seed-default-metrics.ts
        env:
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}

      - name: Apply cascade delete triggers
        run: ./scripts/apply-cascade-triggers.sh
        env:
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}
          SESSION_SECRET: test-secret-key-for-ci
          ADMIN_USER: admin
          ADMIN_EMAIL: admin@test.com
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg

          # Verify GPG key fingerprint with exact matching to prevent partial match attacks
          FINGERPRINT=$(sudo gpg --no-default-keyring --keyring /etc/apt/trusted.gpg.d/postgresql.gpg --fingerprint ACCC4CF8 2>/dev/null | grep -A1 "pub" | tail -n1 | tr -d ' ')
          EXPECTED="B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "❌ PostgreSQL GPG key fingerprint verification failed"
            echo "Expected: $EXPECTED"
            echo "Got: $FINGERPRINT"
            exit 1
          fi
          echo "✅ PostgreSQL GPG key fingerprint verified"

          # Make keyring immutable to prevent TOCTOU race condition
          # KNOWN LIMITATION: There is a small TOCTOU (time-of-check-time-of-use) window between
          # GPG key verification and APT package installation. The chattr +i command below
          # mitigates this risk by making the keyring immutable after verification.
          # However, on filesystems that don't support chattr (e.g., tmpfs), the immutability
          # flag cannot be set. In practice, this is a low-risk scenario in GitHub Actions
          # because the runner environment is ephemeral and isolated.
          # Alternative mitigation: Use apt-key with inline verification (not implemented due
          # to apt-key deprecation in newer Ubuntu versions).
          if sudo chattr +i /etc/apt/trusted.gpg.d/postgresql.gpg 2>/dev/null; then
            echo "✅ Keyring set to immutable"
          else
            echo "⚠️  chattr +i not supported on this filesystem - TOCTOU mitigation not available"
            echo "   This is a known limitation on some CI runner filesystems (e.g., tmpfs)"
          fi

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Update alternatives to use PostgreSQL 17 by default
          sudo update-alternatives --install /usr/bin/pg_dump pg_dump /usr/lib/postgresql/17/bin/pg_dump 100
          sudo update-alternatives --install /usr/bin/pg_restore pg_restore /usr/lib/postgresql/17/bin/pg_restore 100
          # Verify version
          pg_dump --version

      - name: Backup staging database
        run: node scripts/backup-database.js
        env:
          USE_RAILWAY_BACKUPS: false
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_SERVICE_ID }}
          PUBLIC_DATABASE_URL: ${{ secrets.RAILWAY_STAGING_PUBLIC_DATABASE_URL }}
          BACKUP_RETENTION_DAYS: 7

      # NOTE: Backup artifacts are NOT uploaded to GitHub Actions for security reasons.
      # Staging backups may contain production-like data and should not be stored in GitHub.
      # Access backups via Railway CLI: railway run --service <SERVICE_ID> ls backups/
      # See docs/database-migration-rollback.md for backup access procedures

      - name: Validate database migrations
        run: |
          echo "🔍 Validating migrations for safety..."
          npm run db:validate
          echo "✅ Migration validation passed"

      - name: Run database migrations
        timeout-minutes: 30
        id: migrate
        run: |
          echo "🔄 Running database migrations BEFORE deployment..."
          echo "⚠️  CRITICAL: Migrations must complete before deploying new code"
          echo ""
          echo "📦 Running drizzle migrations (0000-0013)..."
          npm run db:migrate
          echo "✅ Drizzle migrations completed"
          echo ""
          echo "📦 Running manual SQL migrations (0014-0021)..."
          npm run db:migrate:manual
          echo "✅ Manual migrations completed"
          echo ""
          echo "✅ All migrations completed successfully"
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_STAGING_PUBLIC_DATABASE_URL }}

      - name: Verify migration completion
        timeout-minutes: 5
        id: verify-migrations
        if: steps.migrate.outcome == 'success'
        run: |
          echo "🔍 Verifying all migrations applied correctly..."
          node scripts/verify-migration-completion.js
          echo "✅ Migration verification passed"
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_STAGING_PUBLIC_DATABASE_URL }}

      - name: Handle migration failure
        if: failure() && (steps.migrate.outcome == 'failure' || steps.verify-migrations.outcome == 'failure')
        env:
          VERIFY_OUTCOME: ${{ steps.verify-migrations.outcome }}
          DATABASE_URL: ${{ secrets.RAILWAY_STAGING_PUBLIC_DATABASE_URL }}
        run: |
          # Sanitize DATABASE_URL for logging (hide password)
          # Extract protocol and host, mask credentials
          SAFE_DB_URL="${DATABASE_URL%%://*}://****:****@${DATABASE_URL##*@}"

          echo "❌ Migration failed - deployment BLOCKED"
          echo "Database: $SAFE_DB_URL"
          echo ""
          if [ "$VERIFY_OUTCOME" == "failure" ]; then
            echo "⚠️  Migration verification detected incomplete database structure!"
            echo "   This usually means migrations were skipped due to existing schema."
            echo ""
            echo "🔧 Resolution steps:"
            echo "1. Manually apply missing migrations from migrations/ folder"
            echo "2. Run: railway run --environment staging bash"
            echo "3. Apply migrations: for f in migrations/*.sql; do psql \$DATABASE_URL -f \$f; done"
            echo "4. Re-run this workflow"
            echo ""
          fi
          echo "⚠️  Manual intervention required:"
          echo "1. Check Railway logs for migration errors"
          echo "2. Review verification output above"
          echo "3. Restore database from backup if needed"
          echo "4. Review migration files for issues"
          echo ""
          echo "See docs/database-migration-rollback.md for detailed procedures"
          exit 1

      - name: Deploy to Railway Staging
        if: steps.migrate.outcome == 'success' && steps.verify-migrations.outcome == 'success'
        run: |
          echo "🚀 Deploying to Railway Staging..."

          # Deploy with retry logic for transient failures
          MAX_ATTEMPTS=3
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Deployment attempt $ATTEMPT of $MAX_ATTEMPTS..."

            if railway up --service "${{ secrets.RAILWAY_STAGING_SERVICE_ID }}" --detach; then
              echo "✅ Deployment initiated successfully"
              exit 0
            else
              EXIT_CODE=$?
              echo "❌ Deployment attempt $ATTEMPT failed with exit code $EXIT_CODE"

              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                WAIT_TIME=$((ATTEMPT * 10))
                echo "⏳ Waiting ${WAIT_TIME} seconds before retry..."
                sleep $WAIT_TIME
              fi
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "❌ All deployment attempts failed"
          exit 1
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Run health check
        run: node scripts/health-check.js
        env:
          HEALTH_CHECK_URL: ${{ secrets.STAGING_URL }}
          HEALTH_CHECK_TIMEOUT: 60000
          HEALTH_CHECK_RETRIES: 5

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against deployed staging
        id: e2e-tests
        continue-on-error: true
        timeout-minutes: 45  # Playwright setup (5-10min) + full suite (15-25min) + artifacts (2-5min)
        run: npm run test:staging
        env:
          CI: true
          STAGING_URL: ${{ secrets.STAGING_URL }}
          STAGING_USERNAME: ${{ secrets.STAGING_USERNAME }}
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
          E2E_COACH_USERNAME: ${{ secrets.E2E_COACH_USERNAME }}
          E2E_COACH_PASSWORD: ${{ secrets.E2E_COACH_PASSWORD }}
          E2E_ATHLETE_USERNAME: ${{ secrets.E2E_ATHLETE_USERNAME }}
          E2E_ATHLETE_PASSWORD: ${{ secrets.E2E_ATHLETE_PASSWORD }}

      - name: Upload E2E test artifacts
        if: always() && steps.e2e-tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ github.run_number }}
          path: |
            playwright-report/
            !playwright-report/**/*.zip
            !playwright-report/**/trace*
            test-results/
            !test-results/**/*.zip
            !test-results/**/trace*
          retention-days: 3
          compression-level: 6  # Default compression (0=none, 9=max)

      - name: Report E2E test results
        if: always() && steps.e2e-tests.outcome != 'skipped'
        env:
          E2E_OUTCOME: ${{ steps.e2e-tests.outcome }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$E2E_OUTCOME" == "success" ]; then
            echo "✅ E2E tests passed!"
          else
            echo "⚠️  E2E tests failed!"
            echo "View test artifacts: https://github.com/$REPO/actions/runs/$RUN_ID"
            echo ""
            echo "Note: Deployment succeeded but E2E tests need attention."
            echo "This is a non-blocking failure - please review and fix failing tests."
          fi

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Staging deployment successful!"
          echo "Staging environment is ready for testing"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Staging deployment failed!"
          echo "Check the logs above for details."
          exit 1
