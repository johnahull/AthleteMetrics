name: Cleanup PR Preview

on:
  pull_request:
    types: [closed]

# Explicit permissions following principle of least privilege
permissions:
  contents: read
  pull-requests: write

jobs:
  cleanup-preview:
    name: Cleanup PR Preview Environment
    runs-on: ubuntu-latest
    # Only run for PRs from the same repository
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Delete PR Environment
        id: cleanup
        run: |
          PR_ENV_NAME="pr-${{ github.event.pull_request.number }}"
          echo "🧹 Cleaning up Railway environment: ${PR_ENV_NAME}"

          # Link to the Railway project first (required for environment commands)
          echo "🔗 Linking to Railway project..."
          set +e
          LINK_OUTPUT=$(railway link --project "$RAILWAY_PROJECT_ID" 2>&1)
          LINK_EXIT_CODE=$?
          set -e

          if [[ "$LINK_EXIT_CODE" -ne 0 ]]; then
            echo "::warning::Failed to link to Railway project. Environment may already be deleted."
            echo "$LINK_OUTPUT"
            echo "cleanup_status=not_found" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "✅ Successfully linked to Railway project"

          # Attempt to delete the environment
          # Capture output and exit code separately to avoid if-statement exit code issues
          set +e
          DELETE_OUTPUT=$(railway environment delete "${PR_ENV_NAME}" --yes 2>&1)
          DELETE_EXIT_CODE=$?
          set -e

          echo "$DELETE_OUTPUT"

          if [[ "$DELETE_EXIT_CODE" -eq 0 ]]; then
            echo "✅ Environment ${PR_ENV_NAME} deleted successfully"
            echo "cleanup_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Environment deletion returned exit code: $DELETE_EXIT_CODE"
            echo "  This may mean the environment didn't exist or was already deleted"
            echo "cleanup_status=not_found" >> "$GITHUB_OUTPUT"
            # Don't fail the workflow if environment doesn't exist
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

      - name: Find preview comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '🚂 Railway Preview Environment'

      - name: Update comment with cleanup status
        if: steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## 🚂 Railway Preview Environment

            ### 🧹 Environment Cleaned Up

            The preview environment for this PR has been deleted.

            | Detail | Value |
            |--------|-------|
            | **PR Status** | ${{ github.event.pull_request.merged && '✅ Merged' || '❌ Closed' }} |
            | **Environment** | `pr-${{ github.event.pull_request.number }}` (deleted) |
            | **Cleanup Status** | ${{ steps.cleanup.outputs.cleanup_status == 'success' && '✅ Deleted' || '⚠️ Already removed' }} |

            ---
            <sub>🤖 Preview environments are automatically cleaned up when PRs are closed or merged.</sub>
