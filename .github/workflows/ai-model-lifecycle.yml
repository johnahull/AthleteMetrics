name: AI Model Lifecycle

# Weekly check that no selectable AI model is about to be retired by its provider.
# Retirement dates are curated in packages/shared/ai-models.ts (`retireAfter`).

on:
  schedule:
    - cron: '0 14 * * 1' # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check AI model retirement dates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Check AI model lifecycle
        run: npx tsx scripts/ai-model-lifecycle.ts
